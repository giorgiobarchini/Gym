<style>

:root {

  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111310; --surface: #1b1e1a; --sunk: #151714; --line: #2c312a; --fg: #eef1e8; --muted: #9ba393;
  --accent: #c8f53a; --accent-ink: #111310; --accent-strong: #c8f53a;
  --legs: #ff8a52; --upper: #6ea2ff; --court: #ffc23d; --rest: #4fd19a; --danger: #ff6b52; --done-bg: #243014; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111310; --surface: #1b1e1a; --sunk: #151714; --line: #2c312a; --fg: #eef1e8; --muted: #9ba393;
  --accent: #c8f53a; --accent-ink: #111310; --accent-strong: #c8f53a;
  --legs: #ff8a52; --upper: #6ea2ff; --court: #ffc23d; --rest: #4fd19a; --danger: #ff6b52; --done-bg: #243014; color-scheme: dark }

html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(100px + env(safe-area-inset-bottom, 0px)) }

h3 { font-size: 20px }
p { margin: 0 }
.sub { color: var(--muted); font-size: 14px }
.small { font-size: 13px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
main { display: flex; flex-direction: column; gap: 16px; padding-top: 6px }
section.block { display: flex; flex-direction: column; gap: 10px }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0 }
a { color: inherit }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 2px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); text-align: center }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }

.between { justify-content: space-between }

.tli .td { font-size: 13px; color: var(--muted) }

.tli.is-now { background: var(--done-bg) }
.tli.mission .tt::after { content: "MISIÓN"; margin-left: 8px; font-size: 10px; letter-spacing: .1em; padding: 2px 6px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); vertical-align: 2px }

.wd .k { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--tc) }
.wd.today { border: 2px solid var(--fg) }

/* exercise list */
.exl { display: flex; flex-direction: column; gap: 8px }

.ai-out { white-space: pre-wrap; background: var(--sunk); border-radius: 14px; padding: 12px; font-size: 15px }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.stat { padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); min-width: 0 }

.weigh { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px }

.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.set-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600 }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }

.setdots { display: flex; justify-content: center; gap: 8px }
.setdots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fg); }

.clock { font-family: var(--mono); font-size: 92px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums }
.ring { width: 260px; height: 260px; max-width: 80vw; max-height: 80vw; position: relative; display: grid; place-items: center }

async function initDb() {

  let id; try { id = await user.id(); } catch { return; }
  if (!id) return;
  const col = db.collection("data/users/" + id);
  const q = new Map();
  const run = (key, fn) => { const p = (q.get(key) || Promise.resolve()).then(fn).catch(() => {}); q.set(key, p); };
  remote = { put: (k, d) => run(k, () => col.doc(k).set(d)), del: k => run(k, () => col.doc(k).delete()) };
  let first = true;
  col.onSnapshot(snap => {
    const fresh = k => !(pending.has(k) && Date.now() - pending.get(k) < 4000);
    if (first && snap.empty) {
      first = false;
      // first time in the cloud: upload what this phone has
      saveSettings(); for (const k in S.days) saveDay(k); for (const k in S.weights) put("w-" + k, S.weights[k]); for (const s of S.sessions) saveSession(s); if (S.active) saveSession(S.active);
      return;
    }
    first = false;
    const sessions = [];
    let active = null;
    for (const d of snap.docs) {
      const v = d.data() || {}, k = d.id;
      if (!fresh(k)) { if (v.kind === "session") { const mine = S.sessions.find(x => x.id === k) || (S.active?.id === k ? S.active : null); if (mine) (mine.finished ? sessions.push(mine) : active = mine); } continue; }

      else if (k.startsWith("w-")) S.weights[k.slice(2)] = v;
      else if (v.kind === "session") { if (v.finished) sessions.push({ ...v, id: k }); else active = { ...v, id: k }; }
    }
    S.sessions = sessions.sort((a, b) => b.start - a.start);
    if (!(S.active && S.active._dirty)) S.active = active;
    lsSave();
    if (!$("#focus").innerHTML) render();
  }, () => {});
}

  if (reduceMotion) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const ctx = c.getContext("2d"), W = c.width = innerWidth * 2, H = c.height = innerHeight * 2;
  const cs = getComputedStyle(document.documentElement), cols = ["--accent", "--legs", "--upper", "--court", "--rest"].map(v => cs.getPropertyValue(v).trim());

function drawSpark() {
  const svg = $("#spark"); if (!svg) return;
  const ks = Object.keys(S.weights).sort(), vals = ks.map(k => +S.weights[k].kg).filter(Boolean);
  if (vals.length < 1) { svg.innerHTML = `<line x1="0" y1="45" x2="300" y2="45" stroke="var(--line)" stroke-dasharray="4 4"/>`; return; }
  const lo = Math.min(...vals, 70) - 1, hi = Math.max(...vals) + 1;
  const X = i => vals.length === 1 ? 150 : 8 + i * (284 / (vals.length - 1)), Y = v => 82 - (v - lo) / (hi - lo) * 74;
  const pts = vals.map((v, i) => `${X(i)},${Y(v)}`).join(" ");
  svg.innerHTML = `<line x1="0" x2="300" y1="${Y(71)}" y2="${Y(71)}" stroke="var(--rest)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="296" y="${Y(71) - 4}" text-anchor="end" font-size="10" fill="var(--rest)">meta 71</text><polyline points="${pts}" fill="none" stroke="var(--accent-strong)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${vals.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === vals.length - 1 ? 4.5 : 2.5}" fill="var(--accent-strong)"/>`).join("")}`;
}

/* =====================================================================
   FOCUS WORKOUT
   ===================================================================== */
let F = null; // {phase:'warm'|'work'|'rest'|'timer'|'done', endAt, total}
let fInt = null;
function lastFor(name) {
  for (const s of S.sessions) for (const e of s.exercises || []) if (e.name === name) { const d = e.sets.filter(x => x.done); if (d.length) return d; }
  return null;
}
function startWorkout(type, minimal) {
  if (S.active) return resume();
  const ph = phaseFor(weekNo()), s = SESS[type];
  let items = s.items;
  if (minimal) items = items.slice(0, 3);
  S.active = {
    id: uid(), type, name: (minimal ? "Mínima · " : "") + `Gym ${type}: ${s.name}`, start: Date.now(), finished: false, minimal: !!minimal, idx: -1, setIdx: 0,
    exercises: items.map(it => {
      const ex = EX[it.ex], last = lastFor(ex.n), n = Math.max(minimal ? 2 : 0, setsFor(it, ph) - (minimal ? 1 : 0));
      return { id: it.ex, name: ex.n, rest: it.rest, target: it.reps, each: !!it.each, auto: !!it.auto,
        sets: Array.from({ length: n }, (_, j) => ({ kg: ex.w ? (last?.[Math.min(j, last.length - 1)]?.kg ?? "") : "", reps: last?.[Math.min(j, last.length - 1)]?.reps ?? it.reps, done: false })) };
    }),
  };
  saveSession(S.active); closeSheet(); unlockAudio(); keepAwake(true);
  F = { phase: "warm" }; renderFocus();
}
function resume() { closeSheet(); unlockAudio(); keepAwake(true); const a = S.active; F = { phase: a.idx < 0 ? "warm" : "work" }; renderFocus(); }
function cur() { const a = S.active; return a.exercises[a.idx]; }
function persist() { if (S.active) { S.active._dirty = true; saveSession(S.active); setTimeout(() => S.active && (S.active._dirty = false), 4500); } }
function nextStep() {
  const a = S.active, e = cur();
  if (a.setIdx < e.sets.length - 1) { a.setIdx++; }
  else {
    a.idx++; a.setIdx = 0;
    if (a.idx >= a.exercises.length) { a.idx = a.exercises.length - 1; F = { phase: a.minimal ? "done" : "cool" }; persist(); return renderFocus(); }
  }
  persist(); F = { phase: "work" }; renderFocus();
}
function startTimer(phase, sec) { clearInterval(fInt); F = { phase, total: sec, endAt: Date.now() + sec * 1000 }; renderFocus(); fInt = setInterval(tickFocus, 200); }
function tickFocus() {
  if (!F || !F.endAt) return clearInterval(fInt);
  const left = Math.max(0, Math.ceil((F.endAt - Date.now()) / 1000));
  const c = $("#f-clock"); if (c) c.textContent = fmtClock(left);
  const ring = $("#f-ring"); if (ring) ring.style.strokeDashoffset = (1 - left / Math.max(1, F.total)) * 754;
  if (left <= 3 && left > 0 && F.lastBeep !== left) { F.lastBeep = left; beep(1, 660); }
  if (left <= 0) {
    clearInterval(fInt);
    if (F.phase === "timer") { const a = S.active, e = cur(); e.sets[a.setIdx].done = true; beep(2, 990); const lastSet = a.setIdx >= e.sets.length - 1; if (lastSet && a.idx >= a.exercises.length - 1) return nextStep(); startTimer("rest", e.rest + (+S.settings.restBoost || 0)); }
    else { beep(3, 880); nextStep(); }
  }
}
function finishWorkout() {
  const a = S.active; if (!a) return;
  a.finished = true; a.end = Date.now(); a.exercises = a.exercises.filter(e => e.sets.some(x => x.done)); delete a.idx; delete a.setIdx; a._dirty = false;
  S.sessions.unshift(a); S.active = null; saveSession(a);
  const k = dkey(new Date()); const d = dayState(k); d.done.workout = 1; saveDay(k);
  clearInterval(fInt); F = null; $("#focus").innerHTML = ""; keepAwake(false); tab = "hoy"; render(); confetti(); toast("¡Misión cumplida! Entrenamiento guardado.");
}
function renderFocus() {
  const a = S.active, el = $("#focus");
  if (!a || !F) { el.innerHTML = ""; return; }
  const total = a.exercises.reduce((x, e) => x + e.sets.length, 0), done = a.exercises.reduce((x, e) => x + e.sets.filter(s => s.done).length, 0);
  const top = `<div class="fbar"><button class="btn sm" data-act="f-close" aria-label="Salir del modo foco">✕</button><div class="bar"><i style="width:${Math.round(100 * done / Math.max(1, total))}%"></i></div><span class="num small">${done}/${total}</span><button class="btn sm" data-act="f-list">Lista</button></div>`;
  let body = "";
  if (F.phase === "warm") {
    body = `<div class="restview"><span class="label">Paso 1 · 10 minutos</span><h2>Calentamiento</h2><div class="card" style="text-align:left;width:100%"><ul>${WARMUP.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><p class="sub">Subí el pulso y mové todo. Con esto ya arrancaste: lo más difícil ya pasó.</p>${a.minimal ? `<span class="chip">Versión mínima: 3 ejercicios</span>` : ""}</div>
      <button class="btn primary big block" data-act="f-warmdone">Listo, vamos</button>`;
  } else if (F.phase === "cool") {
    body = `<div class="restview"><span class="label">Último paso · 10 minutos</span><h2>Cardio suave y estirar</h2><div class="card" style="text-align:left;width:100%"><ul>${COOLDOWN.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><p class="sub">Bajá las pulsaciones. Mañana te vas a mover mejor.</p></div>
      <button class="btn primary big block" data-act="f-cooldone">Listo, terminé</button>`;
  } else if (F.phase === "done") {
    body = `<div class="restview"><h2>¡Terminaste!</h2><p class="mantra">Hoy le ganaste a tu cabeza.</p><div class="stats" style="width:100%"><div class="stat"><div class="v num">${done}</div><div class="k">series</div></div><div class="stat"><div class="v num">${Math.round((Date.now() - a.start) / 60000)}′</div><div class="k">minutos</div></div><div class="stat"><div class="v num">${Math.round(volume(a))}</div><div class="k">kg totales</div></div></div><p class="sub">Ahora: ducha y desayuno fuerte.</p></div>
      <button class="btn primary big block" data-act="f-finish">Guardar y cerrar</button>`;
  } else {
    const e = cur(), ex = EX[e.id], si = a.setIdx, set = e.sets[si];
    const next = si < e.sets.length - 1 ? `Serie ${si + 2} de ${e.sets.length}` : a.idx < a.exercises.length - 1 ? `Siguiente: ${a.exercises[a.idx + 1].name}` : "Última serie del día";
    const dots = `<div class="setdots">${e.sets.map((x, j) => `<i class="${x.done ? "on" : j === si ? "cur" : ""}"></i>`).join("")}</div>`;
    if (F.phase === "rest" || F.phase === "timer") {
      const work = F.phase === "timer";
      body = `<div class="restview ${work ? "work" : ""}">
        <span class="label">${work ? "¡Dale!" : "Descanso"}</span>
        <div class="ring"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="120" fill="none" stroke="var(--sunk)" stroke-width="16"/><circle id="f-ring" class="fg" cx="130" cy="130" r="120" fill="none" stroke="var(--accent-strong)" stroke-width="16" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="0"/></svg><div class="clock" id="f-clock">${fmtClock(F.total)}</div></div>
        ${work ? `<h2>${esc(e.name)}</h2>` : `<p style="font-size:18px;font-weight:600">${esc(next)}</p><p class="sub">Respirá por la nariz. Tomá agua.</p>`}
        ${dots}
      </div>
      <div class="row">${work ? `<button class="btn grow" data-act="f-skiptimer">Terminé antes</button>` : `<button class="btn grow" data-act="f-time" data-d="-15">−15 s</button><button class="btn grow" data-act="f-time" data-d="15">+15 s</button>`}</div>
      ${work ? "" : `<button class="btn primary big block" data-act="f-skiprest">Ya estoy listo</button>`}`;
    } else {
      const timed = ex.unit === "seg";
      body = `
        <div class="${typeClass(ex.zone)}" style="display:flex;flex-direction:column;gap:10px">
          <span data-fig="${e.id}" data-cls="bigfig"></span>
          <h2>${esc(e.name)}</h2>
          <div class="presc">Serie ${si + 1} de ${e.sets.length} · objetivo ${e.target}${timed ? " s" : " reps"}${e.each ? " por lado" : ""}</div>
          ${dots}
        </div>
        <details class="card" style="padding:12px 14px"><summary style="cursor:pointer;font-weight:600">Cómo se hace</summary><ol class="cues" style="margin-top:8px">${ex.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ol><p class="small" style="margin-top:8px"><b>Si cuesta:</b> ${esc(ex.easier || "")}<br><b>Si sale fácil:</b> ${esc(ex.harder || "")}</p><a class="btn sm" href="${yt(ex.q)}" target="_blank" rel="noopener" style="margin-top:8px">Ver video ↗</a></details>
        ${timed ? "" : `<div class="steppers">
          ${ex.w ? `<label>kg<div class="stepper"><button data-act="f-step" data-f="kg" data-d="-${ex.step || 2.5}" aria-label="Menos peso">−</button><input id="f-kg" inputmode="decimal" value="${esc(set.kg)}" placeholder="0" data-ff="kg"><button data-act="f-step" data-f="kg" data-d="${ex.step || 2.5}" aria-label="Más peso">+</button></div></label>` : `<label>peso<div class="stepper" style="grid-template-columns:1fr"><input value="Corporal" disabled></div></label>`}
          <label>reps<div class="stepper"><button data-act="f-step" data-f="reps" data-d="-1" aria-label="Menos reps">−</button><input id="f-reps" inputmode="numeric" value="${esc(set.reps)}" data-ff="reps"><button data-act="f-step" data-f="reps" data-d="1" aria-label="Más reps">+</button></div></label>
        </div>`}
        ${(() => { const l = lastFor(e.name); return l ? `<p class="sub small" style="text-align:center">La vez pasada: <span class="num">${l.map(x => (x.kg ? x.kg + "×" : "") + x.reps).join("  ")}</span></p>` : ""; })()}
        ${timed ? `<button class="btn primary big block" data-act="f-timer">Empezar ${e.target} s</button>` : `<button class="btn primary big block" data-act="f-set">Serie hecha ✓</button>`}
        <div class="row"><button class="btn ghost grow" data-act="f-skipex">Saltar ejercicio</button></div>`;
    }
  }
  el.innerHTML = `<div class="focus"><div class="in">${top}${body}</div></div>`;
  mountFigures(el);
}

/* =====================================================================

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-act],[data-close]");
  if (!t) return;
  if (t.dataset.close) { if (ev.target === t || t.tagName === "BUTTON") closeSheet(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; closeSheet(); render(); scrollTo(0, 0); return; }
  const k = dkey(new Date());
  const act = t.dataset.act;
  switch (act) {
    case "done": case "toggle": {
      const d = dayState(k), key = t.dataset.key, was = !!d.done[key];
      if (act === "done" || !was) { d.done[key] = 1; delete d.skip[key]; } else delete d.done[key];
      saveDay(k);
      const item = scheduleFor(new Date()).find(i => i.key === key);
      if (!was && item?.mission) { confetti(); toast("¡Misión del día cumplida!"); }
      else if (!was && act === "done") toast(["Bien. Uno menos.", "Eso. Seguí así.", "Hecho. Al siguiente.", "Sumaste uno más."][Math.random() * 4 | 0]);
      render(); break;
    }
    case "skip": { const d = dayState(k); d.skip[t.dataset.key] = 1; saveDay(k); render(); break; }
    case "swap": { const d = dayState(k); d.pick = d.pick || {}; d.pick[t.dataset.slot] = (pick(t.dataset.slot, k) + 1) % MEALS[t.dataset.slot].opts.length; saveDay(k); render(); break; }
    case "start": startWorkout(t.dataset.type, !!t.dataset.min); break;
    case "resume": resume(); break;
    case "noganas": sheetNoGanas(); break;
    case "exinfo": sheetEx(t.dataset.ex); break;
    case "sessinfo": sheetSess(t.dataset.type); break;
    case "daytype": sheetDayType(+t.dataset.dow); break;
    case "setday": S.settings.week[+t.dataset.dow] = t.dataset.val; saveSettings(); closeSheet(); render(); break;
    case "weigh": {
      const kg = parseFloat(($("#w-kg").value || "").replace(",", ".")), waist = parseFloat(($("#w-waist").value || "").replace(",", "."));
      if (!(kg > 30 && kg < 250)) { toast("Poné tu peso en kg, por ejemplo 84,5"); break; }
      S.weights[k] = { kg, ...(waist > 40 ? { waist } : {}) }; put("w-" + k, S.weights[k]); render(); toast("Peso guardado"); break;
    }
    case "restart": if (t.dataset.sure) { S.settings.startDate = k; saveSettings(); render(); toast("Arrancás de nuevo en la semana 1"); } else { t.dataset.sure = 1; t.textContent = "Tocá de nuevo para confirmar"; } break;
    case "shop-clear": S.settings.shop = {}; saveSettings(); render(); break;
    case "ai-meal": aiMeal(); break;
    case "coach": aiCoach(); break;
    // focus
    case "f-close": clearInterval(fInt); F = null; $("#focus").innerHTML = ""; keepAwake(false); render(); toast("Lo dejo guardado. Volvé cuando quieras."); break;
    case "f-warmdone": S.active.idx = 0; S.active.setIdx = 0; persist(); F = { phase: "work" }; renderFocus(); break;
    case "f-step": { const e = cur(), set = e.sets[S.active.setIdx], f = t.dataset.f, dd = +t.dataset.d; set[f] = Math.max(0, Math.round(((parseFloat(set[f]) || 0) + dd) * 10) / 10); renderFocus(); break; }
    case "f-set": {
      const a = S.active, e = cur(), set = e.sets[a.setIdx];
      set.done = true; persist(); unlockAudio();
      // carry this set's numbers into the next one
      if (e.sets[a.setIdx + 1] && !e.sets[a.setIdx + 1].done) { e.sets[a.setIdx + 1].kg = e.sets[a.setIdx + 1].kg === "" ? set.kg : e.sets[a.setIdx + 1].kg; }
      const last = a.setIdx >= e.sets.length - 1 && a.idx >= a.exercises.length - 1;
      if (last) nextStep(); else startTimer("rest", e.rest + (+S.settings.restBoost || 0));
      break;
    }
    case "f-timer": unlockAudio(); startTimer("timer", +cur().target); break;
    case "f-skiptimer": F.endAt = Date.now(); tickFocus(); break;
    case "f-skiprest": clearInterval(fInt); nextStep(); break;
    case "f-time": F.endAt += +t.dataset.d * 1000; F.total = Math.max(5, F.total + +t.dataset.d); tickFocus(); break;
    case "f-skipex": { const a = S.active; a.setIdx = cur().sets.length - 1; nextStep(); break; }
    case "f-list": {
      const a = S.active;
      sheet(`<h2>Entrenamiento</h2><div class="exl">${a.exercises.map((e, i) => `<button class="exi" data-act="f-jump" data-i="${i}"><span data-fig="${e.id}"></span><span style="min-width:0"><span class="n">${esc(e.name)}</span><br><span class="p">${e.sets.filter(x => x.done).length}/${e.sets.length} series</span></span><span>${i === a.idx ? "●" : e.sets.every(x => x.done) ? "✓" : ""}</span></button>`).join("")}</div>
        <button class="btn primary" data-act="f-end">Terminar ahora</button><button class="btn ghost danger" data-act="f-discard">Descartar entrenamiento</button><button class="btn ghost" data-close="1">Cerrar</button>`);
      break;
    }
    case "f-jump": { const a = S.active, i = +t.dataset.i; a.idx = i; const firstOpen = a.exercises[i].sets.findIndex(x => !x.done); a.setIdx = firstOpen < 0 ? 0 : firstOpen; clearInterval(fInt); persist(); closeSheet(); F = { phase: "work" }; renderFocus(); break; }
    case "f-end": closeSheet(); if (!setsDone(S.active)) { toast("Hacé al menos una serie para guardarlo"); break; } clearInterval(fInt); F = { phase: "cool" }; renderFocus(); break;
    case "f-cooldone": F = { phase: "done" }; renderFocus(); break;
    case "f-finish": finishWorkout(); break;
    case "f-discard":
      if (t.dataset.sure) { const a = S.active; S.active = null; del(a.id); clearInterval(fInt); F = null; closeSheet(); $("#focus").innerHTML = ""; keepAwake(false); render(); }
      else { t.dataset.sure = 1; t.textContent = "Tocá de nuevo para descartar"; }
      break;
  }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.ff && S.active) { const set = cur().sets[S.active.setIdx]; set[t.dataset.ff] = t.value.replace(",", "."); clearTimeout(t._t); t._t = setTimeout(persist, 600); }
  if (t.id === "why") { S.settings.why = t.value; clearTimeout(t._t); t._t = setTimeout(saveSettings, 800); }
  if (t.id === "gymDrive") { const v = parseInt(t.value, 10); if (v >= 0 && v < 120) { S.settings.gymDrive = v; clearTimeout(t._t); t._t = setTimeout(() => { saveSettings(); render(); }, 900); } }
  if (t.id === "commute") { const v = parseInt(t.value, 10); if (v >= 0 && v < 180) { S.settings.commute = v; clearTimeout(t._t); t._t = setTimeout(() => { saveSettings(); render(); }, 900); } }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.skill) { S.settings.skills = { ...(S.settings.skills || {}) }; if (t.checked) S.settings.skills[t.dataset.skill] = 1; else delete S.settings.skills[t.dataset.skill]; saveSettings(); if (t.checked) { confetti(); toast("¡Meta lograda! Seguí con la próxima."); } render(); }
  if (t.dataset.week) { S.settings.week[+t.dataset.week] = t.value; saveSettings(); render(); }
  if (t.dataset.shop) { S.settings.shop = { ...(S.settings.shop || {}), [t.dataset.shop]: t.checked }; if (!t.checked) delete S.settings.shop[t.dataset.shop]; saveSettings(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* =====================================================================
   CLAUDE (optional)
   ===================================================================== */
const PROFILE = "Usuario: hombre de 29 años, 84 kg con ~60 kg de masa magra, quiere bajar a 10–12% de grasa y ganar músculo. Juega basket por diversión. Entrena 5 días a la mañana con una rutina funcional orientada a calistenia. Objetivo diario: ~2150 kcal y 170 g de proteína. Tiene TDAH: necesita respuestas cortas, concretas y fáciles de seguir. Hablale de vos, en español rioplatense.";
async function aiMeal() {
  const out = $("#ai-meal-out"), have = $("#fridge").value.trim(), slot = $("#fridge-slot").value;
  if (!have) { toast("Escribí qué tenés en la heladera"); return; }
  out.hidden = false; out.textContent = "Pensando…";
  const opt = MEALS[slot].opts[0];
  try {
    await sample(`${PROFILE}\n\nArmá UNA comida para "${MEALS[slot].name}" (apuntá a ~${opt.kcal} kcal y ~${opt.p} g de proteína) usando principalmente esto que tiene: ${have}.\nSi falta proteína, decí qué agregar.\nFormato en texto plano, sin markdown ni asteriscos:\nNombre de la comida\nIngredientes con cantidades (lista con guiones)\nPasos (máximo 4, cortos)\nAprox: X kcal · Y g proteína · Z min`, { onText: ({ text }) => { out.textContent = text; }, modelTier: "quick" });
  } catch (e) { out.textContent = e?.code === "not_granted" ? "No tengo permiso para pensar recetas desde esta página." : "No pude armar la receta ahora. Probá de nuevo en un rato."; }
}
async function aiCoach() {
  const out = $("#coach-out"), msg = $("#coach-in").value.trim() || "No tengo ganas de entrenar.";
  out.hidden = false; out.textContent = "…";
  const t = typeOf(new Date());
  try {
    await sample(`${PROFILE}\nHoy le toca: ${DAYTYPE[t].label}${SESS[t] ? " (" + SESS[t].name + ")" : ""}. Su porqué: "${S.settings.why || "no lo escribió"}".\n\nTe dice: "${msg}"\n\nRespondé como un coach cálido pero firme, en 3 a 5 oraciones cortas. Validá lo que siente en una oración, después dale UNA acción concreta y chiquita para hacer en los próximos 2 minutos. Si hay un motivo real para no entrenar (dolor, enfermedad, lesión), decile que descanse. Sin markdown.`, { onText: ({ text }) => { out.textContent = text; }, modelTier: "quick", cache: false });
  } catch (e) { out.textContent = "No pude responder ahora. Hacé solo esto: ponete las zapatillas."; }
}

/* boot */
render();
if (S.active) { /* show resume option on Hoy */ }
setInterval(() => { if (!$("#focus").innerHTML && !$("#sheet").innerHTML && tab === "hoy" && !document.activeElement?.matches("input,textarea,select")) render(); }, 60000);
initDb();
})();
</script>
