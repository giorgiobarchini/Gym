<title>Cuaderno de Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, sticky top bar, bottom tab bar, cards only for exercises */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --line: #dcdfd8; --fg: #1b1f1a; --muted: #6a7166;
  --accent: #d4ff3a; --accent-ink: #1b1f1a; --accent-strong: #5b7a00; --danger: #c23b22; --done: #e9f5c8;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121411; --surface: #1c1f1b; --line: #2e332c; --fg: #eef0ea; --muted: #9aa294;
  --accent: #d4ff3a; --accent-ink: #121411; --accent-strong: #c2ee2a; --danger: #ff6b52; --done: #263214; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121411; --surface: #1c1f1b; --line: #2e332c; --fg: #eef0ea; --muted: #9aa294;
  --accent: #d4ff3a; --accent-ink: #121411; --accent-strong: #c2ee2a; --danger: #ff6b52; --done: #263214; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)) }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line) }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; text-transform: uppercase }
h1 { font-size: 28px; line-height: 1 }
h2 { font-size: 22px }
h3 { font-size: 19px }
.sub { color: var(--muted); font-size: 13px }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.sync { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
main { display: flex; flex-direction: column; gap: 14px; padding-top: 14px }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line); background: var(--surface) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { background: transparent }
.btn.danger { color: var(--danger) }
.btn.block { width: 100% }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 10px; width: 100%; min-width: 0 }
input.num { text-align: center; font-size: 17px }
.sets { display: grid; grid-template-columns: 28px 1fr 1fr 48px; gap: 6px; align-items: center }
.sets .h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: center }
.sets .idx { font-family: var(--mono); color: var(--muted); text-align: center }
.chk { width: 48px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; line-height: 1 }
.chk.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
input.on { background: var(--done) }
.hint { font-size: 12px; color: var(--muted) }
.hint b { color: var(--fg); font-family: var(--mono); font-weight: 500 }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden }
.item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; border-top: 1px solid var(--line); text-align: left; width: 100%; min-width: 0 }
.item:first-child { border-top: 0 }
.item .t { font-weight: 600 }
.item .m { color: var(--muted); font-size: 13px; overflow-wrap: anywhere }
.pill { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.stat { padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
.stat .v { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1 }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 14px }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
nav.tabs button { min-height: 58px; font-family: var(--display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 3px solid transparent }
nav.tabs button[aria-current="page"] { color: var(--fg); border-top-color: var(--accent-strong) }
.timer { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--accent); color: var(--accent-ink); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 10px }
.timer .clock { font-family: var(--mono); font-size: 26px; font-variant-numeric: tabular-nums }
.timer button { min-height: 40px; padding: 0 10px; border-radius: 8px; font-weight: 600; background: rgba(0,0,0,.1) }
.timer .bar { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent-ink); opacity: .5 }
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { min-height: 38px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 14px }
.elapsed { font-family: var(--mono); color: var(--muted); font-size: 13px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px }
@media (prefers-reduced-motion: no-preference) { .chk { transition: background .12s } }
</style>

<div class="wrap">
  <header class="top">
    <div><h1>Cuaderno de Gym</h1><div class="sub" id="today"></div></div>
    <div class="sync" id="sync">Cargando…</div>
  </header>
  <main id="view"></main>
</div>
<div class="timer" id="timer" hidden>
  <div class="bar" id="tbar"></div>
  <div><div class="label" style="color:inherit;opacity:.7">Descanso</div><div class="clock" id="tclock">1:30</div></div>
  <div class="row"><button id="tminus">−15</button><button id="tplus">+15</button><button id="tskip">Listo</button></div>
</div>
<nav class="tabs">
  <button data-tab="hoy" aria-current="page">Entrenar</button>
  <button data-tab="historial">Historial</button>
  <button data-tab="rutinas">Rutinas</button>
</nav>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const fmtDate = ts => new Date(ts).toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
  const fmtMin = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min"; };
  const fmtClock = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  $("#today").textContent = new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });

  const EXAMPLE_ROUTINES = [
    { id: "r-push", name: "Empuje", exercises: ["Press banca", "Press militar", "Press inclinado mancuernas", "Fondos", "Extensión de tríceps"] },
    { id: "r-pull", name: "Tirón", exercises: ["Dominadas", "Remo con barra", "Jalón al pecho", "Face pull", "Curl de bíceps"] },
    { id: "r-legs", name: "Piernas", exercises: ["Sentadilla", "Peso muerto rumano", "Prensa", "Curl femoral", "Gemelos de pie"] },
  ];
  const COMMON = ["Press banca", "Sentadilla", "Peso muerto", "Press militar", "Dominadas", "Remo con barra", "Jalón al pecho", "Prensa", "Hip thrust", "Curl de bíceps", "Extensión de tríceps", "Elevaciones laterales", "Zancadas", "Plancha"];

  // ---------- state ----------
  let state = { routines: null, sessions: [], active: null, restSec: 90 };
  let tab = "hoy";
  let store = null;        // {saveSession, deleteSession, savePlan}
  let mode = "local";

  // ---------- storage: db (private per user) with localStorage fallback ----------
  const LS = "gym-notebook-v1";
  const lsLoad = () => { try { return JSON.parse(localStorage.getItem(LS)) || null; } catch { return null; } };
  const lsSave = () => { try { localStorage.setItem(LS, JSON.stringify({ routines: state.routines, sessions: state.sessions, active: state.active, restSec: state.restSec })); } catch {} };

  const local = lsLoad();
  if (local) Object.assign(state, local);
  store = { saveSession: async () => lsSave(), deleteSession: async () => lsSave(), savePlan: async () => lsSave() };
  setSync(local ? "Guardado en este teléfono" : "Sin conexión a la nube");

  function setSync(t) { $("#sync").textContent = t; }

  async function initDb() {
    if (!window.claude?.use) return;
    let db, user;
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch { return; }
    if (!db || !user) return;
    let id; try { id = await user.id(); } catch { return; }
    if (!id) return;
    const col = db.collection("data/users/" + id);
    const timeout = setTimeout(() => setSync("Nube lenta, usando el teléfono"), 10000);
    col.onSnapshot(snap => {
      clearTimeout(timeout);
      mode = "db";
      const sessions = [], plan = {};
      for (const d of snap.docs) {
        const v = d.data() || {};
        if (d.id === "plan") Object.assign(plan, v);
        else if (v.kind === "session") sessions.push({ ...v, id: d.id });
      }
      if (snap.empty && local && (local.sessions?.length || local.routines)) {
        // first time on the cloud: carry over what this phone had
        migrate(col);
      } else {
        state.sessions = sessions.filter(s => s.finished || closedIds.has(s.id) && state.sessions.some(x => x.id === s.id)).sort((a, b) => b.start - a.start);
        const act = sessions.find(s => !s.finished);
        if (act && !closedIds.has(act.id) && !(state.active?.id === act.id && (state.active.dirty || editing))) state.active = act;
        if (!act && state.active && !state.active.dirty) state.active = null;
        if (plan.routines) state.routines = plan.routines;
        if (plan.restSec) state.restSec = plan.restSec;
        lsSave();
        render();
      }
      setSync("Guardado en la nube");
    }, err => { clearTimeout(timeout); setSync("Guardado en este teléfono"); });

    const writeQueue = new Map();
    const write = (key, fn) => {
      const prev = writeQueue.get(key) || Promise.resolve();
      const next = prev.then(fn).catch(() => setSync("Sin nube: guardado local"));
      writeQueue.set(key, next);
      return next;
    };
    store = {
      saveSession: s => { lsSave(); const { dirty, ...clean } = s; return write(s.id, () => col.doc(s.id).set({ ...clean, kind: "session" })); },
      deleteSession: s => { lsSave(); return write(s.id, () => col.doc(s.id).delete()); },
      savePlan: () => { lsSave(); return write("plan", () => col.doc("plan").set({ routines: state.routines || EXAMPLE_ROUTINES, restSec: state.restSec })); },
    };
  }
  async function migrate(col) {
    try {
      for (const s of local.sessions || []) await col.doc(s.id).set({ ...s, kind: "session" });
      if (local.active) await col.doc(local.active.id).set({ ...local.active, kind: "session" });
      if (local.routines) await col.doc("plan").set({ routines: local.routines, restSec: local.restSec || 90 });
    } catch {}
  }
  let editing = false;
  const closedIds = new Set();

  // ---------- helpers ----------
  const routines = () => state.routines || EXAMPLE_ROUTINES;
  function lastFor(name) {
    for (const s of state.sessions) {
      const ex = s.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
      if (ex) { const done = ex.sets.filter(x => x.done && (x.kg !== "" || x.reps !== "")); if (done.length) return { sets: done, date: s.start }; }
    }
    return null;
  }
  function bestFor(name) {
    let best = null;
    for (const s of state.sessions) for (const e of s.exercises) if (e.name.toLowerCase() === name.toLowerCase())
      for (const x of e.sets) if (x.done && +x.kg > 0 && (!best || +x.kg > best.kg)) best = { kg: +x.kg, reps: x.reps };
    return best;
  }
  const volume = s => s.exercises.reduce((a, e) => a + e.sets.reduce((b, x) => b + (x.done ? (+x.kg || 0) * (+x.reps || 0) : 0), 0), 0);
  const setsDone = s => s.exercises.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0);
  function newExercise(name) {
    const last = lastFor(name);
    const sets = last ? last.sets.map(x => ({ kg: x.kg, reps: x.reps, done: false })) : [{ kg: "", reps: "", done: false }, { kg: "", reps: "", done: false }, { kg: "", reps: "", done: false }];
    return { name, sets };
  }
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }
  let saveT;
  function saveActiveSoon() { if (!state.active) return; state.active.dirty = true; lsSave(); clearTimeout(saveT); saveT = setTimeout(() => { const a = state.active; if (a) store.saveSession(a).then(() => { if (state.active === a) a.dirty = false; }); }, 700); }

  // ---------- wake lock ----------
  let lock = null;
  async function keepAwake(on) {
    try { if (on && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } if (!on && lock) { await lock.release(); lock = null; } } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.active) keepAwake(true); });

  // ---------- rest timer ----------
  let tEnd = 0, tTotal = 0, tInt = null, actx = null;
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      [0, .25, .5].forEach(d => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d + .2); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .2); });
      navigator.vibrate?.([200, 100, 200]);
    } catch {}
  }
  function startRest(sec = state.restSec) { tTotal = sec; tEnd = Date.now() + sec * 1000; $("#timer").hidden = false; clearInterval(tInt); tInt = setInterval(tick, 250); tick(); try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {} }
  function tick() {
    const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
    $("#tclock").textContent = fmtClock(left);
    $("#tbar").style.width = (100 * (1 - left / Math.max(1, tTotal))) + "%";
    if (left <= 0) { stopRest(); beep(); toast("¡A la próxima serie!"); }
  }
  function stopRest() { clearInterval(tInt); $("#timer").hidden = true; }
  $("#tminus").onclick = () => { tEnd -= 15000; tTotal = Math.max(15, tTotal - 15); tick(); };
  $("#tplus").onclick = () => { tEnd += 15000; tTotal += 15; tick(); };
  $("#tskip").onclick = stopRest;

  // ---------- views ----------
  function render() {
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    const v = $("#view");
    if (tab === "hoy") v.innerHTML = state.active ? viewActive() : viewStart();
    else if (tab === "historial") v.innerHTML = viewHistory();
    else v.innerHTML = viewRoutines();
  }

  function viewStart() {
    const week = state.sessions.filter(s => s.start > Date.now() - 7 * 864e5);
    const last = state.sessions[0];
    return `
      <div class="stats">
        <div class="stat"><div class="v num">${week.length}</div><div class="k">Esta semana</div></div>
        <div class="stat"><div class="v num">${state.sessions.length}</div><div class="k">Entrenamientos</div></div>
        <div class="stat"><div class="v num">${last ? Math.round((Date.now() - last.start) / 864e5) : "–"}</div><div class="k">Días del último</div></div>
      </div>
      <div class="label">Empezar con una rutina${state.routines ? "" : " (ejemplos, editalas en Rutinas)"}</div>
      <div class="list">
        ${routines().map(r => `<button class="item" data-start="${esc(r.id)}"><div style="min-width:0"><div class="t">${esc(r.name)}</div><div class="m">${esc(r.exercises.join(" · "))}</div></div><span class="pill">${r.exercises.length} ej.</span></button>`).join("")}
      </div>
      <button class="btn block" data-start="">Entrenamiento libre</button>`;
  }

  function viewActive() {
    const a = state.active;
    return `
      <div class="row between">
        <div><h2>${esc(a.name)}</h2><div class="elapsed" id="elapsed">${fmtMin(Date.now() - a.start)} · ${setsDone(a)} series</div></div>
        <button class="btn primary" data-act="finish">Terminar</button>
      </div>
      ${a.exercises.map((e, i) => {
        const last = lastFor(e.name), best = bestFor(e.name);
        return `<section class="card">
          <div class="row between"><h3>${esc(e.name)}</h3><button class="btn ghost" data-act="exmenu" data-i="${i}" aria-label="Opciones de ${esc(e.name)}">···</button></div>
          ${last || best ? `<div class="hint">${last ? `Última vez: <b>${last.sets.map(x => `${x.kg || 0}×${x.reps || 0}`).join("  ")}</b>` : ""}${best ? ` · Récord: <b>${best.kg} kg</b>` : ""}</div>` : ""}
          <div class="sets">
            <div class="h">#</div><div class="h">kg</div><div class="h">reps</div><div class="h">✓</div>
            ${e.sets.map((x, j) => `<div class="idx">${j + 1}</div>
              <input class="num ${x.done ? "on" : ""}" id="kg-${i}-${j}" inputmode="decimal" placeholder="kg" value="${esc(x.kg)}" data-f="kg" data-i="${i}" data-j="${j}" aria-label="kg serie ${j + 1}">
              <input class="num ${x.done ? "on" : ""}" id="rp-${i}-${j}" inputmode="numeric" placeholder="reps" value="${esc(x.reps)}" data-f="reps" data-i="${i}" data-j="${j}" aria-label="reps serie ${j + 1}">
              <button class="chk ${x.done ? "on" : ""}" data-act="done" data-i="${i}" data-j="${j}" aria-pressed="${x.done}" aria-label="Serie ${j + 1} hecha">${x.done ? "✓" : ""}</button>`).join("")}
          </div>
          <div class="row"><button class="btn" data-act="addset" data-i="${i}">+ Serie</button>${e.sets.length > 1 ? `<button class="btn ghost" data-act="delset" data-i="${i}">− Serie</button>` : ""}</div>
        </section>`;
      }).join("")}
      <button class="btn block" data-act="addex">+ Agregar ejercicio</button>
      <button class="btn block ghost danger" data-act="discard">Descartar entrenamiento</button>`;
  }

  function viewHistory() {
    if (!state.sessions.length) return `<div class="empty">Todavía no hay entrenamientos.<br>Terminá uno en <b>Entrenar</b> y aparece acá.</div>`;
    return `<div class="list">${state.sessions.map(s => `<button class="item" data-open="${esc(s.id)}"><div style="min-width:0"><div class="t">${esc(s.name)}</div><div class="m">${fmtDate(s.start)} · ${fmtMin((s.end || s.start) - s.start)} · ${setsDone(s)} series</div></div><span class="pill">${Math.round(volume(s)).toLocaleString("es-AR")} kg</span></button>`).join("")}</div>`;
  }

  function viewRoutines() {
    return `
      ${state.routines ? "" : `<div class="hint">Estas rutinas son ejemplos. Cambialas por las tuyas.</div>`}
      ${routines().map((r, i) => `<section class="card">
        <div class="row between"><h3>${esc(r.name)}</h3><button class="btn ghost" data-act="editr" data-i="${i}">Editar</button></div>
        <div class="m sub">${esc(r.exercises.join(" · ")) || "Sin ejercicios"}</div>
      </section>`).join("")}
      <button class="btn block" data-act="newr">+ Nueva rutina</button>
      <section class="card">
        <label class="label" for="rest">Descanso entre series (segundos)</label>
        <input class="num" id="rest" inputmode="numeric" value="${state.restSec}">
      </section>`;
  }

  // ---------- sheets ----------
  function sheet(html) { $("#sheet").innerHTML = `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
  function closeSheet() { $("#sheet").innerHTML = ""; }

  function sheetAddExercise() {
    const used = new Set(state.active.exercises.map(e => e.name));
    const known = [...new Set([...state.sessions.flatMap(s => s.exercises.map(e => e.name)), ...routines().flatMap(r => r.exercises), ...COMMON])].filter(n => !used.has(n));
    sheet(`<h2>Agregar ejercicio</h2>
      <div class="row" style="flex-wrap:nowrap"><input id="exname" placeholder="Nombre del ejercicio" autocomplete="off"><button class="btn primary" data-act="addexok">Agregar</button></div>
      <div class="chips">${known.slice(0, 30).map(n => `<button class="chip" data-pick="${esc(n)}">${esc(n)}</button>`).join("")}</div>
      <button class="btn ghost" data-close="1">Cancelar</button>`);
  }

  function sheetRoutine(i) {
    const r = i == null ? { id: uid(), name: "", exercises: [] } : routines()[i];
    sheet(`<h2>${i == null ? "Nueva rutina" : "Editar rutina"}</h2>
      <label class="label" for="rname">Nombre</label><input id="rname" value="${esc(r.name)}" placeholder="Ej: Torso A">
      <label class="label" for="rex">Ejercicios, uno por línea</label>
      <textarea id="rex" rows="8" style="font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%">${esc(r.exercises.join("\n"))}</textarea>
      <button class="btn primary" data-act="saver" data-i="${i ?? ""}" data-id="${esc(r.id)}">Guardar</button>
      ${i != null ? `<button class="btn ghost danger" data-act="delr" data-i="${i}">Borrar rutina</button>` : ""}
      <button class="btn ghost" data-close="1">Cancelar</button>`);
  }

  function sheetSession(id) {
    const s = state.sessions.find(x => x.id === id); if (!s) return;
    sheet(`<div><h2>${esc(s.name)}</h2><div class="sub">${fmtDate(s.start)} · ${fmtMin((s.end || s.start) - s.start)} · ${Math.round(volume(s)).toLocaleString("es-AR")} kg de volumen</div></div>
      ${s.exercises.map(e => `<div class="card"><h3>${esc(e.name)}</h3><div class="mono">${e.sets.filter(x => x.done).map(x => `${x.kg || 0} kg × ${x.reps || 0}`).join("<br>") || '<span class="sub">Sin series hechas</span>'}</div></div>`).join("")}
      <button class="btn" data-act="repeat" data-id="${esc(s.id)}">Repetir este entrenamiento</button>
      <button class="btn ghost danger" data-act="delsess" data-id="${esc(s.id)}" id="delsess">Borrar</button>
      <button class="btn ghost" data-close="1">Cerrar</button>`);
  }

  // ---------- actions ----------
  function start(routineId, fromSession) {
    const r = routines().find(x => x.id === routineId);
    const names = fromSession ? fromSession.exercises.map(e => e.name) : r ? r.exercises : [];
    state.active = { id: uid(), name: fromSession ? fromSession.name : r ? r.name : "Entrenamiento libre", start: Date.now(), finished: false, exercises: names.map(newExercise) };
    store.saveSession(state.active);
    tab = "hoy"; keepAwake(true); render();
    if (!names.length) sheetAddExercise();
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab],[data-start],[data-act],[data-open],[data-pick],[data-close]");
    if (!t) return;
    if (t.dataset.close && e.target !== t) return;
    if (t.dataset.close) return closeSheet();
    if (t.dataset.tab) { tab = t.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
    if (t.dataset.start !== undefined) return start(t.dataset.start);
    if (t.dataset.open) return sheetSession(t.dataset.open);
    if (t.dataset.pick) { $("#exname").value = t.dataset.pick; return addExOk(); }
    const a = state.active, i = +t.dataset.i, j = +t.dataset.j;
    switch (t.dataset.act) {
      case "done": {
        const x = a.exercises[i].sets[j]; x.done = !x.done;
        if (x.done && x.reps === "") { const p = a.exercises[i].sets[j - 1]; if (p) { x.reps = p.reps; if (x.kg === "") x.kg = p.kg; } }
        saveActiveSoon(); render(); if (x.done) startRest(); break;
      }
      case "addset": { const s = a.exercises[i].sets, p = s[s.length - 1] || {}; s.push({ kg: p.kg ?? "", reps: p.reps ?? "", done: false }); saveActiveSoon(); render(); break; }
      case "delset": a.exercises[i].sets.pop(); saveActiveSoon(); render(); break;
      case "addex": sheetAddExercise(); setTimeout(() => $("#exname")?.focus(), 50); break;
      case "addexok": addExOk(); break;
      case "exmenu":
        sheet(`<h2>${esc(a.exercises[i].name)}</h2>
          ${i > 0 ? `<button class="btn" data-act="up" data-i="${i}">Subir</button>` : ""}
          ${i < a.exercises.length - 1 ? `<button class="btn" data-act="down" data-i="${i}">Bajar</button>` : ""}
          <button class="btn danger" data-act="delex" data-i="${i}">Quitar ejercicio</button>
          <button class="btn ghost" data-close="1">Cancelar</button>`); break;
      case "up": case "down": { const k = t.dataset.act === "up" ? i - 1 : i + 1; [a.exercises[i], a.exercises[k]] = [a.exercises[k], a.exercises[i]]; closeSheet(); saveActiveSoon(); render(); break; }
      case "delex": a.exercises.splice(i, 1); closeSheet(); saveActiveSoon(); render(); break;
      case "finish": {
        if (!setsDone(a)) { toast("Marcá al menos una serie con ✓"); break; }
        a.finished = true; a.end = Date.now(); closedIds.add(a.id); delete a.dirty; clearTimeout(saveT);
        a.exercises = a.exercises.filter(e => e.sets.some(x => x.done));
        state.sessions.unshift(a); state.active = null; store.saveSession(a);
        stopRest(); keepAwake(false); toast("Entrenamiento guardado"); render(); break;
      }
      case "discard":
        if (t.dataset.sure) { const old = a; closedIds.add(old.id); state.active = null; clearTimeout(saveT); store.deleteSession(old); stopRest(); keepAwake(false); render(); }
        else { t.dataset.sure = "1"; t.textContent = "Tocá de nuevo para descartar"; }
        break;
      case "repeat": { const s = state.sessions.find(x => x.id === t.dataset.id); closeSheet(); if (state.active) { toast("Terminá el entrenamiento actual primero"); break; } start(null, s); break; }
      case "delsess":
        if (t.dataset.sure) { const s = state.sessions.find(x => x.id === t.dataset.id); state.sessions = state.sessions.filter(x => x !== s); if (s) store.deleteSession(s); closeSheet(); render(); }
        else { t.dataset.sure = "1"; t.textContent = "Tocá de nuevo para borrar"; }
        break;
      case "newr": sheetRoutine(null); break;
      case "editr": sheetRoutine(i); break;
      case "saver": {
        const name = $("#rname").value.trim() || "Rutina";
        const exercises = $("#rex").value.split("\n").map(s => s.trim()).filter(Boolean);
        const list = [...routines()];
        const r = { id: t.dataset.id, name, exercises };
        if (t.dataset.i === "") list.push(r); else list[+t.dataset.i] = r;
        state.routines = list; store.savePlan(); closeSheet(); render(); toast("Rutina guardada"); break;
      }
      case "delr":
        if (t.dataset.sure) { const list = [...routines()]; list.splice(i, 1); state.routines = list; store.savePlan(); closeSheet(); render(); }
        else { t.dataset.sure = "1"; t.textContent = "Tocá de nuevo para borrar"; }
        break;
    }
  });

  function addExOk() {
    const n = $("#exname").value.trim(); if (!n) return;
    state.active.exercises.push(newExercise(n)); closeSheet(); saveActiveSoon(); render();
    setTimeout(() => document.querySelectorAll(".card")[state.active.exercises.length - 1]?.scrollIntoView({ block: "center" }), 30);
  }

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.f && state.active) { editing = true; state.active.exercises[+t.dataset.i].sets[+t.dataset.j][t.dataset.f] = t.value.replace(",", "."); saveActiveSoon(); clearTimeout(editing.t); setTimeout(() => editing = false, 1500); }
    if (t.id === "rest") { const v = parseInt(t.value, 10); if (v > 0 && v < 1200) { state.restSec = v; clearTimeout(t._t); t._t = setTimeout(() => store.savePlan(), 600); } }
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "exname") addExOk(); if (e.key === "Escape") closeSheet(); });
  setInterval(() => { const el = $("#elapsed"); if (el && state.active) el.textContent = `${fmtMin(Date.now() - state.active.start)} · ${setsDone(state.active)} series`; }, 30000);

  render();
  if (state.active) keepAwake(true);
  initDb();
})();
</script>
